# CloudEco: Marine Plastic Detection System
# Author: Devesh Gurusinghe
# Purpose: Ansible inventory for master and worker nodes
#
# Update ansible_host values after `terraform apply` (or from `terraform output`).

[k8s_nodes]
k8s-master ansible_host=MASTER_EXTERNAL_IP ansible_user=YOUR_SSH_USER ansible_ssh_private_key_file=~/.ssh/google_compute_engine
k8s-worker-1 ansible_host=WORKER1_EXTERNAL_IP ansible_user=YOUR_SSH_USER ansible_ssh_private_key_file=~/.ssh/google_compute_engine
k8s-worker-2 ansible_host=WORKER2_EXTERNAL_IP ansible_user=YOUR_SSH_USER ansible_ssh_private_key_file=~/.ssh/google_compute_engine
